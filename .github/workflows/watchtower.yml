name: watchtower

on:
  push:
    branches: [master]
    paths:
      - 'watchtower/**'
      - '.github/workflows/watchtower.yml'
  pull_request:
    branches: [master]
    paths:
      - 'watchtower/**'
      - '.github/workflows/watchtower.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchtower-ghcr-publication
  cancel-in-progress: false

env:
  WATCHTOWER_TAG: v1.23.1
  WATCHTOWER_COMMIT: 520f95dea6e3c99b3e0e656e4a2950af11d6397b
  WATCHTOWER_IMAGE: ghcr.io/naiba-forks/watchtower
  WATCHTOWER_IMAGE_VERSION: v1.23.1-520f95d

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: ALL
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Fetch exact central configuration and audited upstream source
        env:
          CENTRAL_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init central-build
          git -C central-build remote add origin https://github.com/naiba/Dockerfiles.git
          git -C central-build fetch --no-tags --depth=1 origin "${CENTRAL_COMMIT}"
          git -C central-build checkout --detach FETCH_HEAD
          test "$(git -C central-build rev-parse HEAD)" = "${CENTRAL_COMMIT}"
          git init watchtower-source
          git -C watchtower-source remote add origin https://github.com/nicholas-fedor/watchtower.git
          git -C watchtower-source fetch --no-tags --depth=1 origin "+refs/tags/${WATCHTOWER_TAG}:refs/tags/${WATCHTOWER_TAG}"
          test "$(git -C watchtower-source rev-parse "refs/tags/${WATCHTOWER_TAG}^{commit}")" = "${WATCHTOWER_COMMIT}"
          git -C watchtower-source checkout --detach "${WATCHTOWER_COMMIT}"
          test "$(git -C watchtower-source rev-parse HEAD)" = "${WATCHTOWER_COMMIT}"
          python3 - <<'PYREVIEW'
          import hashlib, json, os
          from pathlib import Path
          approval = json.loads(Path('central-build/watchtower/review-approval.json').read_text())
          assert approval['conclusion'] == '通过'
          assert approval['upstream_commit'] == os.environ['WATCHTOWER_COMMIT']
          for filename, expected in approval['build_files_sha256'].items():
              assert hashlib.sha256((Path('central-build') / filename).read_bytes()).hexdigest() == expected, filename
          print('Approved immutable source and build configuration verified')
          PYREVIEW
          cp central-build/watchtower/Dockerfile watchtower-source/Dockerfile.central

      - name: Cross-compile audited source without upstream build scripts
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build \
            --platform "linux/${TARGET_ARCH}" \
            --build-arg "TARGETARCH=${TARGET_ARCH}" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --label "org.opencontainers.image.source=https://github.com/naiba-forks/watchtower" \
            --label "org.opencontainers.image.documentation=https://github.com/naiba/Dockerfiles/tree/master/watchtower" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "ba.nai.watchtower.upstream.source=https://github.com/nicholas-fedor/watchtower" \
            --label "ba.nai.watchtower.upstream.revision=${WATCHTOWER_COMMIT}" \
            --label "ba.nai.watchtower.build.revision=${GITHUB_SHA}" \
            --label "com.centurylinklabs.watchtower=true" \
            --tag "${WATCHTOWER_IMAGE}:${WATCHTOWER_IMAGE_VERSION}-${GITHUB_RUN_ID}-${TARGET_ARCH}" \
            --file watchtower-source/Dockerfile.central watchtower-source

      - name: Publish architecture image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.NAIBA_PAT }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "${GHCR_TOKEN}"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username naiba --password-stdin
          test "$(git ls-remote https://github.com/naiba/Dockerfiles.git refs/heads/master | cut -f1)" = "${GITHUB_SHA}"
          docker push "${WATCHTOWER_IMAGE}:${WATCHTOWER_IMAGE_VERSION}-${GITHUB_RUN_ID}-${TARGET_ARCH}"

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: ALL
    steps:
      - name: Publish and verify multi-architecture tags
        env:
          GHCR_TOKEN: ${{ secrets.NAIBA_PAT }}
        run: |
          set -euo pipefail
          test -n "${GHCR_TOKEN}"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username naiba --password-stdin
          AMD64_IMAGE="${WATCHTOWER_IMAGE}:${WATCHTOWER_IMAGE_VERSION}-${GITHUB_RUN_ID}-amd64"
          ARM64_IMAGE="${WATCHTOWER_IMAGE}:${WATCHTOWER_IMAGE_VERSION}-${GITHUB_RUN_ID}-arm64"
          test "$(git ls-remote https://github.com/naiba/Dockerfiles.git refs/heads/master | cut -f1)" = "${GITHUB_SHA}"
          for architecture in amd64 arm64; do
            image="${WATCHTOWER_IMAGE}:${WATCHTOWER_IMAGE_VERSION}-${GITHUB_RUN_ID}-${architecture}"
            docker pull --platform "linux/${architecture}" "${image}"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${image}")" = "linux/${architecture}"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")" = "${WATCHTOWER_COMMIT}"
            test "$(docker image inspect --format '{{ index .Config.Labels "ba.nai.watchtower.build.revision" }}' "${image}")" = "${GITHUB_SHA}"
          done
          AMD64_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' "${AMD64_IMAGE}")
          ARM64_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' "${ARM64_IMAGE}")
          test "${AMD64_IMAGE}" != "${ARM64_IMAGE}"
          export AMD64_IMAGE ARM64_IMAGE
          for tag in "${WATCHTOWER_IMAGE_VERSION}" "${WATCHTOWER_TAG}" latest; do
            docker manifest create "${WATCHTOWER_IMAGE}:${tag}" "${AMD64_IMAGE}" "${ARM64_IMAGE}"
            docker manifest inspect "${WATCHTOWER_IMAGE}:${tag}" > published-manifest.json
            python3 - <<'PY'
          import json, os
          with open('published-manifest.json') as source:
              manifest = json.load(source)
          platforms = {(entry['platform']['os'], entry['platform']['architecture']) for entry in manifest['manifests']}
          assert len(manifest['manifests']) == 2, manifest
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          assert {entry['digest'] for entry in manifest['manifests']} == {os.environ['AMD64_IMAGE'].split('@')[1], os.environ['ARM64_IMAGE'].split('@')[1]}
          print('Verified candidate platforms and child digests:', sorted(platforms))
          PY
            docker manifest push --purge "${WATCHTOWER_IMAGE}:${tag}"
            docker manifest inspect "${WATCHTOWER_IMAGE}:${tag}" > remote-manifest.json
            python3 -c 'import json; assert json.load(open("published-manifest.json")) == json.load(open("remote-manifest.json"))'
          done
